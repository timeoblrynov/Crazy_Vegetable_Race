<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Crazy Vegetable Race 🥕</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/index.css">
</head>

<body>
  <div id="gameWrapper">

    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div id="hud" class="cache">
      <div id="hudGauche">
        <span>🪙 <span id="hudPieces">0</span></span>
        <span>⏱ <span id="hudTemps">0:00</span></span>
        <span>🏆 Niv. <span id="hudNiveau">1</span></span>
      </div>
      <div id="hudDroite">
        <button class="btnIcone" id="btnParametres">⚙️</button>
        <button class="btnIcone" id="btnPause">⏸</button>
      </div>
    </div>

    <div id="badgeNiveau">🎉 Niveau 2 !</div>

    <div class="ecran" id="ecranMenu">
      <h1 class="logo">🥕 Crazy<br>Vegetable Race</h1>
      <p class="sousTitre">Évite les couteaux, collecte des pièces</p>
      <button class="btn btnVert" id="btnJouer">▶ Jouer</button>
      <button class="btn btnOr" id="btnBoutique">🛒 Boutique</button>
    </div>

    <div class="ecran cache" id="ecranPause">
      <h2>⏸ Pause</h2>
      <button class="btn btnVert" id="btnReprendre">▶ Reprendre</button>
      <button class="btn btnOr" id="btnPauseShop">🛒 Boutique</button>
      <button class="btn btnOr" id="btnPauseParam">⚙️ Paramètres</button>
      <button class="btn btnRouge" id="btnQuitter">🏠 Menu</button>
    </div>

    <div class="ecran cache" id="ecranParametres">
      <h2>⚙️ Paramètres</h2>
      <div class="ligne">
        <label>🎵 Musique</label>
        <input type="range" id="sliderMusique" min="0" max="1" step="0.05" value="0.5">
      </div>
      <div class="ligne">
        <label>🔊 Effets sonores</label>
        <input type="range" id="sliderSfx" min="0" max="1" step="0.05" value="0.7">
      </div>
      <div class="ligne">
        <label>💫 Sensibilité saut</label>
        <input type="range" id="sliderSens" min="0.5" max="2" step="0.1" value="1">
      </div>
      <button class="btn btnVert petit" id="btnRetourParam">✓ Retour</button>
    </div>

    <div class="ecran cache" id="ecranBoutique">
      <h2>🛒 Boutique</h2>
      <div class="affichagePieces">🪙 <span id="boutiquePieces">0</span> pièces</div>
      <div id="grilleSkins"></div>
      <button class="btn btnVert petit" id="btnRetourBoutique">✓ Retour</button>
    </div>

    <div class="ecran cache" id="ecranMort">
      <h2>💀 Game Over !</h2>
      <div class="stats">
        Temps de survie : <span id="mortTemps">0:00</span><br>
        Niveau atteint : <span id="mortNiveau">1</span><br>
        Pièces collectées : <span id="mortPieces">0</span><br>
        Pièces totales : <span id="mortTotal">0</span>
      </div>
      <button class="btn btnVert" id="btnRejouer">🔄 Rejouer</button>
      <button class="btn btnOr" id="btnMortShop">🛒 Boutique</button>
      <button class="btn btnRouge petit" id="btnMortMenu">🏠 Menu</button>
    </div>

  </div>
  <script src="../JS/index.js" defer></script>
</body>
</html>
