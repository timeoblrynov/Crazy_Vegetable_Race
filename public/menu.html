<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy Vegetable Race</title>
    <link rel="stylesheet" href="/public/css/menu.css">
  </head>
  <body>
 
 
    <div id="menu-container">
 
      <div id="perso">🥭</div>
 
      <h1 id="titre">Crazy<br>Vegetable Race</h1>
      <p id="best-score">Meilleur score : <span id="best-val">0</span></p>
 
      <button class="btn-play" onclick="window.location.href='index.html'">JOUER</button>
      <button class="btn-boutique" onclick="ouvrirBoutique()">BOUTIQUE</button>
      <button class="btn-options" onclick="ouvrirOptions()">OPTIONS</button>
 
      <div id="boutique" class="panneau cache">
        <h2>Boutique</h2>
        <p id="coins-boutique">Pièces : <span id="coins-val">0</span></p>

        <div id="grille-skins"></div>

        <button class="btn-options" onclick="fermerBoutique()">Fermer</button>
      </div>
 
      <div id="options" class="panneau cache">
        <h2>Options</h2>

        <div class="option-ligne">

          <label>Musique</label>

          <input type="range" id="vol-musique" min="0" max="100" value="70"
                 oninput="document.getElementById('val-musique').textContent = this.value">
          <span id="val-musique">70</span>
        </div>

        <div class="option-ligne">
          <label>Effets</label>
          <input type="range" id="vol-effets" min="0" max="100" value="80"
                 oninput="document.getElementById('val-effets').textContent = this.value">
          <span id="val-effets">80</span>
        </div>

        <div class="option-ligne">
        <label>Saut</label>
        <input type="range" id="sens-saut" min="1" max="10" value="5"
                oninput="document.getElementById('val-saut').textContent = this.value">
        <span id="val-saut">5</span>
        </div>

        <button class="btn-options" onclick="fermerOptions()">Fermer</button>
      </div>
 
    </div>
 
    <script src="/public/js/menu.js"></script>
 
  </body>
</html>
